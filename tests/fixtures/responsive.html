<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive QA fixture</title>
    <style>
      body {
        margin: 0;
        background: #e8ebe5;
        color: #22372d;
        font:
          14px Arial,
          sans-serif;
        padding: 24px;
      }
      header {
        display: flex;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
        margin: 0 0 20px;
      }
      a {
        color: inherit;
      }
      iframe {
        display: block;
        margin: auto;
        border: 1px solid #a1afa4;
        box-shadow: 0 5px 30px #0001;
        background: #fff;
        border-radius: 8px;
      }
      label {
        font-weight: 600;
      }
      select {
        padding: 7px;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Responsive QA fixture</strong
      ><label
        >Width
        <select id="width">
          <option value="320">Small mobile 320px</option>
          <option value="390" selected>Mobile 390px</option>
          <option value="768">Tablet 768px</option>
          <option value="1280">Desktop 1280px</option>
        </select></label
      ><label
        >View
        <select id="route">
          <option value="/">Homepage</option>
          <option value="/events">Event List</option>
          <option value="/events/web-workshop">Event Details</option>
          <option value="/clubs/tech-collective">Club Details</option>
          <option value="/login">Login</option>
          <option value="/register">Register</option>
        </select></label
      ><a href="/">Open full app</a><output id="metrics" aria-live="polite">Loading preview</output>
    </header>
    <iframe title="Responsive app preview" width="390" height="844" src="/"></iframe>
    <script>
      const frame = document.querySelector('iframe');
      let observer;
      function measurePreview() {
        const root = frame.contentDocument?.documentElement;
        if (!root) return;
        const overflow = root.scrollWidth > root.clientWidth + 1;
        document.querySelector('#metrics').textContent =
          `${frame.contentWindow.innerWidth}px viewport / ${root.scrollWidth}px content / ${overflow ? 'HORIZONTAL OVERFLOW' : 'No horizontal overflow'}`;
      }
      frame.addEventListener('load', () => {
        observer?.disconnect();
        observer = new ResizeObserver(measurePreview);
        observer.observe(frame.contentDocument.body);
        measurePreview();
      });
      document.querySelector('#width').addEventListener('change', (event) => {
        frame.width = event.target.value;
        requestAnimationFrame(measurePreview);
      });
      document
        .querySelector('#route')
        .addEventListener('change', (event) => (frame.src = event.target.value));
    </script>
  </body>
</html>
